<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inter | Operaciones IP - Acceso Interno</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .bg-datacenter {
            background-image: linear-gradient(135deg, rgba(8, 14, 26, 0.88) 0%, rgba(15, 23, 42, 0.80) 50%, rgba(10, 37, 72, 0.85) 100%), url('/static/img/datacenter_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-panel {
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="h-full bg-datacenter text-gray-900 select-none flex items-center justify-center p-4">

    <!-- Tarjeta Central Minimalista de Acceso Interno -->
    <div class="w-full max-w-md mx-auto">
        <div class="glass-panel border border-white/40 dark:border-white/10 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6">
            
            <!-- Cabecera Corporativa: Logotipo Oficial Inter y Titulo Sobrio -->
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-white/60 dark:bg-white/10 border border-gray-100 dark:border-white/10 shadow-xs mb-1">
                    <img src="/static/img/inter_logo.png" alt="Inter" class="h-8 md:h-9 w-auto object-contain">
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Operaciones IP</h1>
                <p class="text-xs text-gray-500 font-medium">Acceso al sistema interno</p>
            </div>

            <!-- Mensaje de Alerta de Error (Dinamico) -->
            <div id="login-alert" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 shrink-0"></i>
                <span id="login-alert-text">Credenciales incorrectas. Verifique su correo o clave.</span>
            </div>

            <!-- Formulario de Autenticacion -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                
                <!-- Campo 1: Correo Corporativo -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-800 mb-1.5">
                        Usuario / Correo
                    </label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3 pointer-events-none"></i>
                        <input type="email" id="email" required autocomplete="email" value="admin@inter.com.ve" placeholder="usuario@inter.com.ve" class="w-full pl-10 pr-4 py-2.5 bg-gray-50/80 border border-gray-200 rounded-xl text-xs text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0078D4] focus:border-transparent transition font-medium">
                    </div>
                </div>

                <!-- Campo 2: Contrasena con Toggle Ojo -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-gray-800">
                            Contraseña
                        </label>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3 pointer-events-none"></i>
                        <input type="password" id="password" required autocomplete="current-password" value="admin" placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 bg-gray-50/80 border border-gray-200 rounded-xl text-xs text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0078D4] focus:border-transparent transition font-medium">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 p-0.5 cursor-pointer" title="Mostrar/Ocultar contraseña">
                            <i data-lucide="eye" id="icon-eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Recordar sesion -->
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                        <input type="checkbox" id="remember" checked class="w-3.5 h-3.5 text-[#0078D4] border-gray-300 rounded focus:ring-[#0078D4]">
                        <span>Recordar sesión</span>
                    </label>
                    <span class="text-[11px] text-gray-400 font-mono">NOC v2.6</span>
                </div>

                <!-- Boton de Envio Primario -->
                <button type="submit" id="btn-submit-login" class="w-full py-2.5 px-4 rounded-xl bg-[#0078D4] hover:bg-[#0067b8] text-white font-semibold text-xs transition shadow-md flex items-center justify-center gap-2 cursor-pointer">
                    <span>Ingresar</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Acceso Rapido Administrador General -->
            <div class="pt-2 border-t border-gray-100 dark:border-gray-800 space-y-2">
                <button type="button" onclick="quickFillAndLogin('admin@inter.com.ve', 'admin')" class="w-full p-2.5 rounded-xl bg-blue-50/80 hover:bg-blue-100/80 border border-blue-100 text-left flex items-center justify-between transition cursor-pointer">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 rounded-lg bg-gray-900 text-white flex items-center justify-center font-bold text-[11px] shadow-xs">
                            AD
                        </div>
                        <div>
                            <p class="text-xs font-bold text-gray-900">Administrador General</p>
                            <p class="text-[10px] text-gray-500 font-mono">admin@inter.com.ve</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-blue-600 text-white">Entrar</span>
                </button>
            </div>

            <!-- Pie Sutil -->
            <div class="text-center pt-1">
                <p class="text-[10px] text-gray-400">
                    Inter Telecomunicaciones C.A. — Red Privada
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts de Interaccion -->
    <script>
        lucide.createIcons();

        function togglePasswordVisibility() {
            const passInput = document.getElementById("password");
            const eyeIcon = document.getElementById("icon-eye");
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.setAttribute("data-lucide", "eye-off");
            } else {
                passInput.type = "password";
                eyeIcon.setAttribute("data-lucide", "eye");
            }
            lucide.createIcons();
        }

        function quickFillAndLogin(email, password) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = password;
            document.getElementById("loginForm").requestSubmit();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const alertBox = document.getElementById("login-alert");
            const alertText = document.getElementById("login-alert-text");
            const submitBtn = document.getElementById("btn-submit-login");

            alertBox.classList.add("hidden");
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verificando...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.status === 'ok') {
                    submitBtn.innerHTML = '<span>Acceso Concedido...</span>';
                    window.location.href = '/';
                } else {
                    alertBox.classList.remove("hidden");
                    alertText.innerText = data.message || "Credenciales inválidas.";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Ingresar</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                    lucide.createIcons();
                }
            } catch (err) {
                alertBox.classList.remove("hidden");
                alertText.innerText = "Error de comunicación con el servidor.";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Ingresar</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
