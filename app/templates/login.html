<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inter | Operaciones IP - Software de Gestión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        snow: {
                            bg: 'var(--snow-bg)',
                            card: 'var(--snow-card)',
                            border: 'var(--snow-border)',
                            text: 'var(--snow-text)',
                            muted: 'var(--snow-muted)',
                            subtle: 'var(--snow-subtle)',
                            input: 'var(--snow-input)',
                            blue: '#0078D4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Snow UI CSS -->
    <link rel="stylesheet" href="/static/css/snow_ui.css?v=2.6">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--snow-bg);
            color: var(--snow-text);
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .snow-card {
            background-color: var(--snow-card);
            border: 1px solid var(--snow-border);
        }
        .snow-input {
            background-color: var(--snow-subtle);
            border: 1px solid var(--snow-border);
            color: var(--snow-text);
        }
        .snow-input:focus {
            background-color: var(--snow-card);
            border-color: #0078D4;
        }
    </style>
</head>
<body class="h-full select-none flex flex-col justify-between p-4 sm:p-6 bg-snow-bg">

    <!-- Top Bar: Header con Selector de Tema ByeWind (Dark / Light Mode) -->
    <header class="w-full flex items-center justify-between max-w-5xl mx-auto py-2">
        <div class="flex items-center gap-2">
            <span class="text-[11px] font-mono tracking-wider uppercase text-snow-muted font-semibold">NOC Inter</span>
            <span class="text-snow-muted/40">•</span>
            <span class="text-[11px] text-snow-muted font-medium">v2.6 Core</span>
        </div>

        <!-- Botón Selector Modo Oscuro (Sign In - B) / Modo Claro (Sign In - A) -->
        <button id="theme-toggle-btn" onclick="toggleAuthTheme()" class="p-2 rounded-xl border border-snow-border hover:bg-gray-100 dark:hover:bg-[#242426] text-snow-muted transition flex items-center justify-center cursor-pointer shadow-2xs" title="Alternar Modo Oscuro (Sign In - B) / Modo Claro (Sign In - A)">
            <span id="theme-icon-container" class="flex items-center justify-center pointer-events-none">
                <i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>
            </span>
        </button>
    </header>

    <!-- Main Container: Tarjeta de Autenticación ByeWind SnowUI (Sign In - B) -->
    <main class="w-full max-w-[420px] mx-auto my-auto">
        <div class="snow-card rounded-2xl p-7 sm:p-9 shadow-xl space-y-6">
            
            <!-- Encabezado Corporativo: INTER / Operaciones IP / Software de Gestión -->
            <div class="text-center space-y-3">
                <div class="inline-flex items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-[#242426] border border-snow-border shadow-2xs">
                    <img src="/static/img/inter_logo.png" alt="Inter" class="h-7 sm:h-8 w-auto object-contain header-logo-inter">
                </div>
                
                <div>
                    <span class="text-[10px] font-bold tracking-widest uppercase text-snow-blue block mb-0.5">INTER</span>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-snow-text">Operaciones IP</h1>
                    <p class="text-xs text-snow-muted font-medium mt-1">Software de Gestión</p>
                </div>
            </div>

            <!-- Mensaje de Alerta de Error (Dinámico) -->
            <div id="login-alert" class="hidden p-3 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 text-xs text-red-700 dark:text-red-300 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-500 shrink-0"></i>
                <span id="login-alert-text">Credenciales incorrectas. Verifique su correo o clave.</span>
            </div>

            <!-- Formulario de Autenticación -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                
                <!-- Campo 1: Usuario / Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-snow-text mb-1.5">
                        Usuario / Correo
                    </label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-snow-muted absolute left-3.5 top-3 pointer-events-none"></i>
                        <input type="email" id="email" required autocomplete="email" value="admin@inter.com.ve" placeholder="admin@inter.com.ve" class="snow-input w-full pl-10 pr-4 py-2.5 rounded-xl text-xs outline-none transition font-medium">
                    </div>
                </div>

                <!-- Campo 2: Contraseña con Toggle Ojo -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-snow-text">
                            Contraseña
                        </label>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-snow-muted absolute left-3.5 top-3 pointer-events-none"></i>
                        <input type="password" id="password" required autocomplete="current-password" value="admin" placeholder="••••••••" class="snow-input w-full pl-10 pr-10 py-2.5 rounded-xl text-xs outline-none transition font-medium">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-snow-muted hover:text-snow-text p-0.5 cursor-pointer" title="Mostrar/Ocultar contraseña">
                            <i data-lucide="eye" id="icon-eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Recordar sesión -->
                <div class="flex items-center justify-between text-xs pt-0.5">
                    <label class="flex items-center gap-2 text-snow-muted cursor-pointer hover:text-snow-text transition">
                        <input type="checkbox" id="remember" checked class="w-3.5 h-3.5 rounded border-snow-border text-snow-blue focus:ring-snow-blue">
                        <span>Recordar sesión</span>
                    </label>
                    <span class="text-[11px] text-snow-muted font-mono">TLS 1.3</span>
                </div>

                <!-- Botón de Envío Primario (Sign In - B SnowUI Spec) -->
                <button type="submit" id="btn-submit-login" class="w-full py-2.5 px-4 rounded-xl bg-gray-900 text-white hover:bg-black dark:bg-white dark:text-gray-900 dark:hover:bg-gray-100 font-semibold text-xs transition shadow-xs flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <span>Iniciar Sesión</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Acceso Rápido Administrador General (1 Clic) -->
            <div class="pt-2 border-t border-snow-border">
                <button type="button" onclick="quickFillAndLogin('admin@inter.com.ve', 'admin')" class="w-full p-2.5 rounded-xl bg-snow-subtle hover:bg-snow-hover border border-snow-border text-left flex items-center justify-between transition cursor-pointer">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 rounded-lg bg-gray-900 text-white flex items-center justify-center font-bold text-[10px] shadow-xs">
                            AD
                        </div>
                        <div>
                            <p class="text-xs font-bold text-snow-text">Administrador General</p>
                            <p class="text-[10px] text-snow-muted font-mono">admin@inter.com.ve</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-blue-50 text-snow-blue dark:bg-blue-900/40 dark:text-blue-300 border border-blue-200 dark:border-blue-800">Acceso Total</span>
                </button>
            </div>

            <!-- Pie Sutil -->
            <div class="text-center pt-1 border-t border-snow-border">
                <p class="text-[10px] text-snow-muted">
                    Inter Telecomunicaciones C.A. — Red Privada NOC
                </p>
            </div>

        </div>
    </main>

    <!-- Footer de la Pantalla -->
    <footer class="w-full text-center py-2 text-[10px] text-snow-muted max-w-5xl mx-auto">
        <span>© 2026 Inter Telecomunicaciones C.A. — Operaciones IP. Todos los derechos reservados.</span>
    </footer>

    <!-- Scripts de Interacción y Gestión de Modo Oscuro / Claro -->
    <script>
        // Inicialización de tema según preferencia guardada (default dark para Sign In - B)
        function initAuthTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme ? (savedTheme === 'dark') : true;
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon(isDark);
        }

        function toggleAuthTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const container = document.getElementById("theme-icon-container");
            if (container) {
                const iconName = isDark ? "sun" : "moon";
                const iconClass = isDark ? "w-4 h-4 text-amber-400" : "w-4 h-4 text-snow-muted";
                container.innerHTML = `<i data-lucide="${iconName}" class="${iconClass}"></i>`;
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons({ root: container });
                }
            }
        }

        initAuthTheme();
        lucide.createIcons();

        function togglePasswordVisibility() {
            const passInput = document.getElementById("password");
            const eyeIcon = document.getElementById("icon-eye");
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.setAttribute("data-lucide", "eye-off");
            } else {
                passInput.type = "password";
                eyeIcon.setAttribute("data-lucide", "eye");
            }
            lucide.createIcons();
        }

        function quickFillAndLogin(email, password) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = password;
            document.getElementById("loginForm").requestSubmit();
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const alertBox = document.getElementById("login-alert");
            const alertText = document.getElementById("login-alert-text");
            const submitBtn = document.getElementById("btn-submit-login");

            alertBox.classList.add("hidden");
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verificando...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.status === 'ok') {
                    submitBtn.innerHTML = '<span>Acceso Concedido...</span>';
                    window.location.href = '/';
                } else {
                    alertBox.classList.remove("hidden");
                    alertText.innerText = data.message || "Credenciales inválidas.";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Iniciar Sesión</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                    lucide.createIcons();
                }
            } catch (err) {
                alertBox.classList.remove("hidden");
                alertText.innerText = "Error de comunicación con el servidor.";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Iniciar Sesión</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
